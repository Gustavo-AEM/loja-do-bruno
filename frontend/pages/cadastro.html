<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Criar conta</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        Minha Biblioteca
    </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="login.html">Entrar</a>
    </nav>

</header>


<main>

    <section class="auth-container">

        <div class="auth-box">

            <h1>Criar conta</h1>

            <form id="cadastroForm">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    required
                >


                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required
                    minlength="6"
                >


                <button
                    type="submit"
                    class="btn"
                >
                    Criar conta
                </button>

            </form>

            <p id="mensagem"></p>

        </div>

    </section>

</main>


<script src="js/auth.js"></script>

</body>

</html>
