<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Entrar - Minha Biblioteca</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        Minha Biblioteca
    </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="cadastro.html">Criar conta</a>
    </nav>

</header>


<main>

    <section class="auth-container">

        <div class="auth-box">

            <h1>Entrar</h1>

            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required
                >


                <button type="submit" class="btn">
                    Entrar
                </button>

            </form>

            <p id="mensagem"></p>

            <p>
                Ainda não possui uma conta?
                <a href="cadastro.html">
                    Criar conta
                </a>
            </p>

        </div>

    </section>

</main>


<script src="js/auth.js"></script>

</body>

</html>
